<!-- components/navbar.html -->
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex">
                <div class="flex-shrink-0 flex items-center">
                    <img src="assets/img/whokan-logo.png" alt="WhoKan Logo" class="h-8 w-auto mr-2">
                    <span class="text-blue-600 text-xl font-bold">WhoKan</span>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                    <a href="dashboard.html" class="nav-link" data-page="dashboard">
                        Dashboard
                    </a>
                    <a href="profile.html" class="nav-link" data-page="profile">
                        My Profile
                    </a>
                    <a href="discover.html" class="nav-link" data-page="discover">
                        Discover Skills
                    </a>
                </div>
            </div>
            <div class="flex items-center">
                <div class="hidden md:flex items-center pr-4 text-sm text-gray-600">
                    Logged in as <span class="current-user-name font-medium ml-1">User</span>
                </div>
                <button class="logout-button bg-gray-100 p-2 rounded-md text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    <span class="sr-only">Sign out</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</nav>

<script>
    // Highlight the current page in the navigation
    document.addEventListener('DOMContentLoaded', () => {
        const currentPage = window.location.pathname.split('/').pop().replace('.html', '');
        const navLinks = document.querySelectorAll('.nav-link');
        
        navLinks.forEach(link => {
            const page = link.getAttribute('data-page');
            if (page === currentPage) {
                link.classList.add('border-indigo-500', 'text-gray-900', 'inline-flex', 'items-center', 'px-1', 'pt-1', 'border-b-2', 'text-sm', 'font-medium');
                link.classList.remove('border-transparent', 'text-gray-500', 'hover:border-gray-300', 'hover:text-gray-700');
            } else {
                link.classList.add('border-transparent', 'text-gray-500', 'hover:border-gray-300', 'hover:text-gray-700', 'inline-flex', 'items-center', 'px-1', 'pt-1', 'border-b-2', 'text-sm', 'font-medium');
            }
        });
    });
</script>
