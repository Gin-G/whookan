<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhoKan - Skill Forum</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navigation -->
    <include src="components/navbar.html"></include>

    <div class="profile-header text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <h1 class="text-3xl font-bold" id="forum-skill-name">Skill Forum</h1>
            <p class="mt-2">Ask questions, share tips, and discuss with the community</p>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Error Message -->
        <div id="error-message" class="hidden mb-4 bg-red-50 border-l-4 border-red-400 p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700" id="error-text"></p>
                </div>
            </div>
        </div>

        <!-- Action bar: new post + chat link -->
        <div class="flex items-center justify-between mb-4">
            <button id="new-post-btn" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                + New Post
            </button>
            <a id="chat-link" href="#" class="inline-flex items-center px-4 py-2 border border-indigo-300 text-sm font-medium rounded-md text-indigo-700 bg-white hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                💬 Live Chat
            </a>
        </div>

        <!-- Post list -->
        <div class="bg-white shadow overflow-hidden sm:rounded-lg">
            <div id="posts-loading" class="text-center py-8">
                <svg class="animate-spin h-6 w-6 text-gray-400 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-gray-400 mt-2 text-sm">Loading posts…</p>
            </div>
            <div id="posts-empty" class="hidden text-center py-12 text-gray-400">
                <p class="text-lg">No posts yet.</p>
                <p class="text-sm mt-1">Be the first to start a discussion!</p>
            </div>
            <ul id="posts-list" class="hidden divide-y divide-gray-200"></ul>
        </div>

        <!-- Post detail panel (hidden initially) -->
        <div id="post-detail" class="hidden mt-6 bg-white shadow overflow-hidden sm:rounded-lg">
            <div class="px-4 py-5 sm:px-6 border-b border-gray-200 flex items-start justify-between">
                <div class="flex-1">
                    <h2 id="detail-title" class="text-xl font-semibold text-gray-900"></h2>
                    <p id="detail-meta" class="text-sm text-gray-500 mt-1"></p>
                </div>
                <div class="flex items-center gap-3 ml-4">
                    <button id="vote-btn" class="inline-flex items-center px-3 py-1.5 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                        ▲ <span id="vote-count" class="ml-1">0</span>
                    </button>
                    <button id="back-btn" class="text-sm text-indigo-600 hover:underline">← Back to list</button>
                </div>
            </div>
            <div class="px-4 py-5 sm:px-6">
                <p id="detail-body" class="text-gray-800 whitespace-pre-wrap"></p>
            </div>

            <!-- Comments -->
            <div class="border-t border-gray-200 px-4 py-5 sm:px-6">
                <h3 class="text-base font-medium text-gray-900 mb-4">Comments <span id="comment-count" class="text-sm text-gray-500"></span></h3>
                <ul id="comments-list" class="space-y-4 mb-6"></ul>

                <!-- Add comment form -->
                <form id="comment-form" class="flex gap-2">
                    <input type="text" id="comment-input" placeholder="Write a comment…"
                        class="flex-1 focus:ring-indigo-500 focus:border-indigo-500 block shadow-sm sm:text-sm border-gray-300 rounded-md">
                    <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
                        Post
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- New Post Modal -->
    <div id="new-post-modal" class="fixed inset-0 hidden z-10 overflow-y-auto" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Create New Post</h3>
                    <form id="new-post-form">
                        <div class="mb-4">
                            <label for="post-title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                            <input type="text" id="post-title" required
                                class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md"
                                placeholder="What's your question or topic?">
                        </div>
                        <div class="mb-4">
                            <label for="post-body" class="block text-sm font-medium text-gray-700 mb-1">Body</label>
                            <textarea id="post-body" rows="5" required
                                class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md"
                                placeholder="Provide details…"></textarea>
                        </div>
                        <div class="flex justify-end gap-2">
                            <button type="button" id="cancel-post-btn"
                                class="px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                                Cancel
                            </button>
                            <button type="submit" id="submit-post-btn"
                                class="px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
                                Post
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/forum.js"></script>
</body>
</html>
