<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhoKan - Skill Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        #messages-container {
            height: 60vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navigation -->
    <include src="components/navbar.html"></include>

    <div class="profile-header text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold" id="chat-skill-name">Skill Chat</h1>
                    <p class="mt-1 text-sm opacity-80">Real-time chat room</p>
                </div>
                <a id="forum-link" href="#"
                    class="inline-flex items-center px-4 py-2 border border-white border-opacity-50 text-sm font-medium rounded-md text-white hover:bg-white hover:bg-opacity-10">
                    📋 Forum
                </a>
            </div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Connection status -->
        <div id="connection-status" class="mb-3 text-sm text-gray-500 flex items-center gap-2">
            <span id="status-dot" class="inline-block w-2 h-2 rounded-full bg-yellow-400"></span>
            <span id="status-text">Connecting…</span>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden mb-4 bg-red-50 border-l-4 border-red-400 p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700" id="error-text"></p>
                </div>
            </div>
        </div>

        <!-- Chat window -->
        <div class="bg-white shadow sm:rounded-lg overflow-hidden flex flex-col">
            <!-- Messages -->
            <div id="messages-container" class="px-4 py-4 space-y-3">
                <div id="messages-placeholder" class="text-center text-gray-400 text-sm py-8">
                    No messages yet. Say hello!
                </div>
            </div>

            <!-- Input bar -->
            <div class="border-t border-gray-200 px-4 py-3 bg-gray-50">
                <form id="chat-form" class="flex gap-2">
                    <input type="text" id="chat-input"
                        placeholder="Type a message and press Enter…"
                        autocomplete="off"
                        class="flex-1 focus:ring-indigo-500 focus:border-indigo-500 block shadow-sm sm:text-sm border-gray-300 rounded-md">
                    <button type="submit"
                        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50"
                        id="send-btn" disabled>
                        Send
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/chat.js"></script>
</body>
</html>
