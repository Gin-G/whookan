<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhoKan - Discover Skills</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navigation -->
    <include src="components/navbar.html"></include>
    
    <div class="profile-header text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <h1 class="text-3xl font-bold">Discover Skills</h1>
            <p class="mt-2">Find colleagues with the skills you need</p>
        </div>
    </div>
    
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Error Message -->
        <div id="error-message" class="hidden mb-4 bg-red-50 border-l-4 border-red-400 p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700"></p>
                </div>
            </div>
        </div>
        
        <div class="bg-white shadow overflow-hidden sm:rounded-lg mb-6">
            <div class="px-4 py-5 sm:px-6">
                <form id="search-form" class="mt-1">
                    <div class="flex rounded-md shadow-sm">
                        <input type="text" id="search-term" placeholder="Search for a skill..." class="focus:ring-indigo-500 focus:border-indigo-500 flex-1 block w-full rounded-none rounded-l-md sm:text-sm border-gray-300">
                        <button type="submit" class="inline-flex items-center px-3 py-2 border border-l-0 border-gray-300 bg-gray-50 rounded-r-md text-gray-500 sm:text-sm">
                            Search
                        </button>
                    </div>
                </form>
            </div>
            <div class="border-t border-gray-200 px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">People with relevant skills</h3>
                
                <div id="search-initial" class="text-center py-4 text-gray-500">
                    Search for a skill to find people who can help.
                </div>
                
                <div id="search-loading" class="hidden text-center py-4">
                    <svg class="animate-spin h-6 w-6 text-gray-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-gray-500 mt-2">Searching...</p>
                </div>
                
                <div id="search-no-results" class="hidden text-center py-4 text-gray-500">
                    No users found with the requested skills.
                </div>
                
                <ul id="search-results" class="hidden divide-y divide-gray-200">
                    <!-- Search results will be loaded here -->
                </ul>
            </div>
        </div>
    </main>

    <!-- Help Request Modal -->
    <div id="help-request-modal" class="fixed inset-0 hidden z-10 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            
            <!-- Modal panel -->
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                                Request Help
                            </h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500">
                                    Describe what kind of help you need from <span id="helper-name" class="font-medium">the selected user</span>.
                                </p>
                                
                                <form id="help-request-form" class="mt-4">
                                    <input type="hidden" id="helper-id">
                                    <input type="hidden" id="skill-id">
                                    
                                    <div class="mb-4">
                                        <label for="skill-select" class="block text-sm font-medium text-gray-700 mb-1">
                                            Select the skill you need help with:
                                        </label>
                                        <select id="skill-select" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
                                            <!-- Skills will be loaded here -->
                                        </select>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label for="request-description" class="block text-sm font-medium text-gray-700 mb-1">
                                            Describe your request:
                                        </label>
                                        <textarea id="request-description" rows="4" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md" placeholder="Please describe what you need help with..."></textarea>
                                    </div>
                                    
                                    <div class="sm:flex sm:flex-row-reverse">
                                        <button type="submit" id="submit-request-button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">
                                            Send Request
                                        </button>
                                        <button type="button" id="close-request-modal" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:w-auto sm:text-sm">
                                            Cancel
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/search.js"></script>
</body>
</html>
