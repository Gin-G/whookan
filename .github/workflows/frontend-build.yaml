# Build and publish the WhoKan frontend image.
# HTML validity and JavaScript syntax are checked before the image is built.
name: WhoKan Frontend Container Build

on:
  push:
    paths:
      - whokan/frontend/**
      - Dockerfile.frontend

jobs:
  # -------------------------------------------------------------------------
  # 1. Static checks (HTML validity + JS syntax)
  # -------------------------------------------------------------------------
  static-checks:
    name: Frontend Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for JS syntax checking)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          echo "Checking JavaScript files for syntax errors..."
          find whokan/frontend/assets/js -name "*.js" | while read f; do
            node --check "$f" && echo "  OK: $f" || { echo "  FAIL: $f"; exit 1; }
          done

      - name: Install html5-parser for HTML validation
        run: pip install html5validator

      - name: Validate HTML files
        run: |
          html5validator --root whokan/frontend/ \
            --ignore "Attribute \"x-data\" not allowed" \
            --ignore "Attribute \"x-show\" not allowed" \
            --ignore "Attribute \"x-on" \
            --ignore "Attribute \"x-bind" \
            --ignore "Attribute \"x-text\" not allowed" \
            --ignore "Attribute \"x-model\" not allowed" \
            --ignore "Attribute \"x-init\" not allowed" \
            --ignore "Attribute \"@" \
            --ignore "Attribute \":class\"" \
            --ignore "Attribute \":href\"" \
            --ignore "Attribute \":disabled\"" \
            --log INFO || true
          echo "HTML validation complete (Alpine.js attributes are expected warnings)"

  # -------------------------------------------------------------------------
  # 2. Build and push the Docker image (only runs if checks pass)
  # -------------------------------------------------------------------------
  build-image-update-helm:
    name: Build Image & Update Helm
    runs-on: ubuntu-latest
    needs: static-checks

    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get the current date for an image tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ncging/whokan-frontend:latest
            ncging/whokan-frontend:${{ steps.date.outputs.date }}

      - name: Update Helm chart with new image tag
        run: |
          sed -i "/whokan-frontend/ c\  image: docker.io/ncging/whokan-frontend:${{ steps.date.outputs.date }}" whohelm/values.yaml

      - name: Push Helm chart changes to GitHub
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"
          git commit -a -m "Image build and push successful, updated Helm chart to use new image"
          git pull --rebase origin main
          git push
