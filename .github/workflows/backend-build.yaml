# Build and publish the WhoKan backend image, then run post-deployment smoke tests.
# Tests run before the image is built; smoke tests run after the new image is live.
name: WhoKan Backend Container Build

on:
  push:
    paths:
      - whokan/backend/**
      - whokan/requirements.txt
      - whokan/requirements-test.txt
      - Dockerfile.backend

jobs:
  # -------------------------------------------------------------------------
  # 1. Unit / integration tests (run against a temporary Postgres container)
  # -------------------------------------------------------------------------
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whokan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            whokan/requirements.txt
            whokan/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r whokan/requirements.txt
          pip install -r whokan/requirements-test.txt

      - name: Run backend tests
        working-directory: whokan/backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whokan_test
          SECRET_KEY: test-secret-key-for-ci-whokan-minimum-32chars!
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: whokan/backend/test-results.xml

  # -------------------------------------------------------------------------
  # 2. Build and push the Docker image (only runs if tests pass)
  # -------------------------------------------------------------------------
  build-image-update-helm:
    name: Build Image & Update Helm
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get the current date for an image tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ncging/whokan-backend:latest
            ncging/whokan-backend:${{ steps.date.outputs.date }}

      - name: Update Helm chart with new image tag
        run: |
          sed -i "/whokan-backend/ c\  image: docker.io/ncging/whokan-backend:${{ steps.date.outputs.date }}" whohelm/values.yaml

      - name: Push Helm chart changes to GitHub
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"
          git commit -a -m "Image build and push successful, updated Helm chart to use new image"
          git pull --rebase origin main
          git push

  # -------------------------------------------------------------------------
  # 3. Post-deployment smoke tests (runs after the Helm chart is updated)
  # -------------------------------------------------------------------------
  smoke-test:
    name: Post-Deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: build-image-update-helm

    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run smoke tests
        env:
          SMOKE_TEST_URL: https://whokan.nickknows.net
          # Allow up to 10 minutes for ArgoCD to sync + Kubernetes to roll out the new pods
          SMOKE_TIMEOUT: "600"
        run: python tests/smoke_test.py
