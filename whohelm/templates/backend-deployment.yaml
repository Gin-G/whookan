apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    group: {{ .Values.app.group }}
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: {{ .Values.backend.image }}
        ports:
        - containerPort: 8000
        env:
        - name: SECRET_KEY
          value: "your-secret-key-value"
        - name: POSTGRES_HOST
          value: "{{ .Values.db.name }}-rw"
        - name: POSTGRES_DB
          value: {{ .Values.db.app.name | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.db.app.owner | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.db.name }}-app-user"
              key: password
        - name: POSTGRES_PORT
          value: "5432"
        - name: ENVIRONMENT
          value: {{ .Values.environment | default "production" | quote }}