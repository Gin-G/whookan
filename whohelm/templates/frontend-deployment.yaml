apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    group: {{ .Values.app.group }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: {{ .Values.frontend.image }}
        ports:
  name: whogres
  instances: 3
        - containerPort: 8080
        env:
        - name: SECRET_KEY
          value: "your-secret-key-value"
        - name: API_URL
          value: "https://whokan.nickknows.net/api/v1"