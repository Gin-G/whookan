app:
  group: whokan
  fqdn: whokan.nickknows.net
  secretKeyPath: whokan
  secretKeyProperty: secret_key_value
backend:
  image: docker.io/ncging/whokan-backend:2026-03-07.02.57
frontend:
  image: docker.io/ncging/whokan-frontend:2026-03-01.22.24
redis:
  image: redis:7-alpine
db:
  name: whogres
  instances: 1
  size: 10Gi
  secretPath: whokan
  # Bounds added 2026-08-18. Observed peak working set was 51Mi
  # (postgres runs shared_buffers=128MB + work_mem=4MB), so 256Mi requests
  # sits above real usage and the 1Gi limit leaves ~10x headroom for vacuum,
  # index builds and query bursts. CPU limit is loose on purpose: throttling
  # a database is worse than the overcommit it prevents.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  app:
    name: whokan-db
    owner: whokan
  superuser:
    userKey: pgsuper
    passwordKey: pgsupass
  appuser:
    userKey: pguser
    passwordKey: pguserpass